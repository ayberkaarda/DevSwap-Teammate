# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  primary:
    <<: *default
    database: dev_swap_development
    username: postgres
    password: "1234"
    host: 127.0.0.1
    port: 5432
  cache:
    <<: *default
    database: dev_swap_development_cache
    username: postgres
    password: "1234"
    host: 127.0.0.1
    port: 5432
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: dev_swap_development_queue
    username: postgres
    password: "1234"
    host: 127.0.0.1
    port: 5432
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: dev_swap_development_cable
    username: postgres
    password: "1234"
    host: 127.0.0.1
    port: 5432
    migrations_paths: db/cable_migrate
  telemetry:
    <<: *default
